name: GTH Master Consolidation — Approved Real Estate Integrity
on:
  push:
    branches: [feat/estate-discovery-quality-20261030, feat/estate-market-workspace-20261029, gth-pro-consolidation-candidate-v1, fix/travel-consistent-outbound, feat/hybrid-portal-buyer-upgrade-20261027]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-real-estate-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve ecosystem shell and Real Estate workflows around the approved explorer redesign
        run: |
          set -euo pipefail
          # Owner-authorized hybrid portal: preserve all central CSS and unrelated workflows.
          # Only these exact onboarding/search/publication files extend the existing scope.
          # Shared navigation/footer, global CSS, publishing and account flows stay protected.
          git diff --exit-code HEAD^1 HEAD -- \
            src/components/Navbar.tsx \
            src/components/Footer.tsx \
            src/app/real-estate/layout.tsx \
            ':(literal)src/app/real-estate/[slug]/' \
            src/app/real-estate/admin/ \
            src/app/real-estate/post-property/ \
            src/app/real-estate/portfolio/ \
            src/app/real-estate/profile/ \
            src/app/real-estate/saved/ \
            src/app/real-estate/tools/ \
            src/components/real-estate/ \
            src/lib/real-estate/ \
            ':!src/components/real-estate/HidePropertyButton.tsx' \
            ':!src/components/real-estate/HiddenProperties.tsx' \
            ':!src/lib/real-estate/discovery-quality.ts' \
            ':!src/app/real-estate/profile/page.tsx' \
            ':!src/components/real-estate/EstateAnalyticsConsent.tsx' \
            ':!src/components/real-estate/ListingViewEvent.tsx' \
            ':!src/components/real-estate/LocalityPriceExplorer.tsx' \
            ':!src/components/real-estate/PropertyEvidence.tsx' \
            ':!src/components/real-estate/PropertyWorkspace.tsx' \
            ':!src/components/real-estate/RegionMapPicker.tsx' \
            ':!src/components/real-estate/RegionSearch.tsx' \
            ':!src/components/real-estate/WorkspaceForm.tsx' \
            ':!src/lib/real-estate/market-evidence.ts' \
            ':!src/lib/real-estate/search-region.ts' \
            ':!src/lib/real-estate/workspace-contract.ts' \
            ':!src/app/api/real-estate/intelligence/route.ts' \
            ':!src/app/api/real-estate/listing-events/route.ts' \
            ':!src/app/api/real-estate/workspace/route.ts' \
            ':!src/components/real-estate/Explorer.module.css' \
            ':!src/components/real-estate/ExplorerCard.tsx' \
            ':!src/components/real-estate/ExplorerDialog.tsx' \
            ':!src/components/real-estate/ExplorerHero.tsx' \
            ':!src/components/real-estate/DiscoveryFilters.tsx' \
            ':!src/components/real-estate/EstateHeader.tsx' \
            ':!src/components/real-estate/RealEstateFooter.tsx' \
            ':!src/components/real-estate/EcosystemPromotions.tsx' \
            ':!src/components/real-estate/PortalCarousel.tsx' \
            ':!src/components/real-estate/HeroMedia.tsx' \
            ':!src/components/real-estate/CampaignPromotions.tsx' \
            ':!src/components/real-estate/GlobalMarkets.tsx' \
            ':!src/components/real-estate/PropertyDetailClient.tsx' \
            ':!src/components/real-estate/PropertyImage.tsx' \
            ':!src/components/real-estate/SavedSearches.tsx' \
            ':!src/components/real-estate/SavePropertyButton.tsx' \
            ':!src/components/real-estate/ProjectInventory.tsx' \
            ':!src/components/real-estate/PropertyCardPro.tsx' \
            ':!src/components/real-estate/EnquiryForm.tsx' \
            ':!src/components/real-estate/OwnerProjectAds.tsx' \
            ':!src/components/real-estate/LeadsDashboard.tsx' \
            ':(exclude,literal)src/app/real-estate/[slug]/page.tsx' \
            ':!src/app/real-estate/post-property/page.tsx' \
            ':!src/app/real-estate/tools/page.tsx' \
            ':!src/app/real-estate/tools/layout.tsx' \
            ':!src/app/real-estate/saved/page.tsx' \
            ':!src/app/real-estate/admin/page.tsx' \
            ':!src/lib/real-estate/propertyService.ts' \
            ':!src/lib/real-estate/hybrid-search.ts' \
            ':!src/lib/real-estate/area.ts' \
            ':!src/lib/real-estate/listing-schema.ts' \
            ':!src/components/real-estate/AreaConverter.tsx' \
            ':!src/components/real-estate/RegistryPhotoProjects.tsx' \
            ':!src/components/real-estate/RegistryDiscovery.tsx' \
            ':!src/app/api/real-estate/registry-preview/route.ts' \
            ':!src/components/real-estate/BuyerPlanningStudio.tsx' \
            ':!src/components/real-estate/ResearchWorkspace.tsx' \
            ':!src/components/real-estate/ShareRegistryComparison.tsx' \
            ':!src/lib/real-estate/buyer-planning.ts' \
            ':!src/components/real-estate/DecisionTools.tsx' \
            ':!src/components/real-estate/GlobalGateway.tsx' \
            ':!src/components/real-estate/RecentlyViewed.tsx' \
            ':!src/lib/real-estate/decision-tools.ts' \
            ':!src/lib/real-estate/recently-viewed.ts' \
            ':!src/lib/real-estate/browser-download.ts' \
            ':!src/lib/real-estate/research-notes.ts' \
            ':!src/lib/real-estate/registry-search.ts' \
            ':!src/lib/real-estate/registry-reader.ts' \
            ':!src/app/api/real-estate/search/route.ts' \
            ':!src/app/api/real-estate/enquiries/route.ts' \
            ':!src/app/api/real-estate/submissions/route.ts' \
            ':!src/app/api/admin/submissions/route.ts' \
            ':!src/lib/real-estate/buyer-leads.ts' \
            ':!src/lib/real-estate/emi.ts' \
            ':!src/lib/real-estate/lead-server.ts' \
            ':!src/lib/real-estate/property-seo.ts' \
            ':!src/lib/real-estate/explorer.ts' \
            ':!src/lib/real-estate/saved-searches.ts' \
            ':(exclude,literal)src/app/api/real-estate/dossier/[slug]/route.ts' \
            ':(exclude,literal)src/app/api/real-estate/locality/[slug]/route.ts' \
            ':(exclude,literal)src/app/real-estate/[slug]/dossier/page.tsx' \
            ':!src/components/mobile/BottomNav.tsx' \
            ':!src/components/real-estate/LocalityIntelligence.tsx' \
            ':!src/components/real-estate/PrintDossier.tsx' \
            ':!src/lib/real-estate/connectivity.ts' \
            ':!src/lib/real-estate/dossier-pdf.ts' \
            src/app/api/real-estate/ \
            src/app/api/admin/submissions/route.ts \
            src/components/brand/BrandVideo.tsx \
            src/components/mobile/BottomNav.tsx \
            public/brand/property-story.jpg \
            public/brand/property-story.mp4
          # Keep every existing central CSS byte protected while permitting only
          # the new, explicitly scoped hotel booking extension at the end.
          python3 scripts/check-hotel-css-scope.py
          # These eight feature files were reviewed in PR #123 and integrated at
          # ced80d13. Keep them byte-identical to that immutable reviewed revision;
          # do not broadly exempt the rest of Real Estate or the mobile shell.
          git diff --exit-code ced80d13d59f6dd33bb8970683faea0c419d9283 HEAD -- \
            ':(literal)src/app/api/real-estate/dossier/[slug]/route.ts' \
            ':(literal)src/app/api/real-estate/locality/[slug]/route.ts' \
            ':(literal)src/app/real-estate/[slug]/dossier/page.tsx' \
            src/components/mobile/BottomNav.tsx \
            src/components/real-estate/LocalityIntelligence.tsx \
            src/components/real-estate/PrintDossier.tsx \
            src/lib/real-estate/connectivity.ts \
            src/lib/real-estate/dossier-pdf.ts
          # Root metadata may change for SEO, but approved rendered layout/navbar is byte-identical.
          git show HEAD^1:src/app/layout.tsx \
            | sed -n '/^export default function RootLayout/,$p' \
            | sed '/^            if (window.location.pathname === "\/app" || window.location.pathname.startsWith("\/app\/")) return;$/d' > /tmp/gth-approved-root-ui
          # The explicitly scoped app-only affiliate guard is the sole allowed
          # difference to the global shell: preserve every other RootLayout byte.
          grep -Fqx '            if (window.location.pathname === "/app" || window.location.pathname.startsWith("/app/")) return;' src/app/layout.tsx
          sed -n '/^export default function RootLayout/,$p' src/app/layout.tsx \
            | sed '/^            if (window.location.pathname === "\/app" || window.location.pathname.startsWith("\/app\/")) return;$/d' > /tmp/gth-candidate-root-ui
          diff -u /tmp/gth-approved-root-ui /tmp/gth-candidate-root-ui
          node --test tests/mobile-app-affiliate-isolation.test.mjs
      - name: Verify narrowly scoped registry-first onboarding and header controls
        run: |
          set -euo pipefail
          # These two components are owner-authorized additions to the guarded scope.
          # The repo-wide protected boundaries stay intact, including central CSS.
          node --test tests/real-estate-registry-first-navigation.test.mjs
      - name: Guard approved GTH PRO flagship and legacy ecosystem split
        run: |
          grep -Fq 'import FlagshipHome from "@/components/home/FlagshipHome";' src/app/page.tsx
          grep -Fq 'return <FlagshipHome />;' src/app/page.tsx
          grep -Fq '<HeroSlider />' src/app/mega-aggregator/page.tsx
          grep -Fq 'href="/mega-aggregator"' src/components/home/FlagshipHome.tsx
          if grep -Fq 'GTHHomeV13' src/app/page.tsx; then
            echo 'The retired V13 homepage must not render at root.'
            exit 1
          fi

  build-travel-and-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p "test_rera_csv_import.py"
      - run: python3 -m unittest discover -s tests -p "test_hotel_import.py"
      - run: python3 -m unittest discover -s tests -p "test_tender_import.py"
      - run: python3 -m unittest discover -s tests -p "test_open_tenders.py"
      - run: python3 -m unittest discover -s tests -p "test_global_tenders.py"
      - run: python3 -m unittest discover -s tests -p "test_additional_tenders.py"
      - run: python3 -m unittest discover -s tests -p "test_tender_oidc.py"
      - name: Inspect public source schemas (no sensitive fields)
        run: python3 scripts/tenders/schema_probe.py
      - name: Probe additional official open procurement feeds (read-only)
        run: python3 scripts/tenders/registry_probe.py
      - name: Read-only licensed India World Bank opportunity probe
        run: python3 scripts/tenders/india_worldbank_probe.py
      - name: Live official source smoke (no database writes)
        run: python3 scripts/tenders/global_ingestion.py --source all --limit 100
      - name: Setup Deno for secure tender gateway validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase GitHub OIDC gateway
        run: deno check --config supabase/functions/gth-tender-ingest/deno.json supabase/functions/gth-tender-ingest/index.ts
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run test:security
      - run: npm run lint
      - name: Production build (no deployment or promotion)
        run: npm run build
      - name: Verify registry streaming and buyer tools over HTTP
        run: node scripts/check-hybrid-buyer-http.mjs
