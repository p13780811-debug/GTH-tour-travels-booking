name: GTH Independent Native Mobile — isolated CI
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/gth-mobile/**"
      - ".github/workflows/gth-independent-native-ci.yml"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gth-native-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/gth-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify website application files are unchanged
        working-directory: .
        run: |
          git fetch --no-tags origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD -- src/ public/ vercel.json next.config.ts package.json package-lock.json || true)"
          if [ -n "$changed" ]; then
            echo "Website source or deployment configuration changed:"; echo "$changed"; exit 1
          fi
      - name: Install isolated Expo / React Native dependencies
        run: npm install --no-audit --no-fund
      - name: Verify native colors reflect central website CSS
        run: npm run theme:check
      - name: Strict TypeScript verification
        run: npm run typecheck
      - name: Native source and API boundary tests
        run: npm test
      - name: Export Android JavaScript bundle without publishing
        run: npm run export
      - name: Export isolated React Native web preview
        run: npm run export:web
      - name: Install pixel QA browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Pixel QA — phone-width actual Expo UI
        run: |
          python3 -m http.server 4100 --bind 127.0.0.1 --directory web-dist > /tmp/gth-native-web.log 2>&1 &
          ok=0
          for i in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:4100/ > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/gth-native-web.log; exit 1; fi
          node scripts/qa-pixel-preview.mjs
      - name: Upload screenshot QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-mobile-pixel-qa
          path: /tmp/gth-native-pixel-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload native JS build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-android-js-export
          path: apps/gth-mobile/dist
          retention-days: 3

  android-debug-apk:
    name: Unsigned-store / local-debug Android installable APK
    needs: mobile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/gth-mobile
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install isolated native application
        run: npm install --no-audit --no-fund
      - name: Generate local Android project without touching website
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build test-installable debug APK (not Play Store)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm debug APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK for physical Android testing
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-debug-apk-not-play-store
          path: apps/gth-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
