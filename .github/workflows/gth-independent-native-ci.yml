name: GTH Independent Native Mobile — isolated CI
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/gth-mobile/**"
      - ".github/workflows/gth-independent-native-ci.yml"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      play_version_code:
        description: "Build an unsigned Play candidate from main with this unused version code"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gth-native-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/gth-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify protected website files outside approved OSM SEO scope are unchanged
        working-directory: .
        run: |
          git fetch --no-tags origin main
          node apps/gth-mobile/scripts/check-isolation.mjs
      - name: Install isolated Expo / React Native dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify native colors reflect central website CSS
        run: npm run theme:check
      - name: Strict TypeScript verification
        run: npm run typecheck
      - name: Native source and API boundary tests
        run: npm test
      - name: Export Android JavaScript bundle without publishing
        run: npm run export
      - name: Export isolated React Native web preview
        run: npm run export:web
      - name: Install pixel QA browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Pixel QA — phone-width actual Expo UI
        run: |
          python3 -m http.server 4100 --bind 127.0.0.1 --directory web-dist > /tmp/gth-native-web.log 2>&1 &
          ok=0
          for i in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:4100/ > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/gth-native-web.log; exit 1; fi
          node scripts/qa-pixel-preview.mjs
          node scripts/qa-functional-preview.mjs
          node scripts/qa-super-app-preview.mjs
      - name: Upload screenshot QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-mobile-pixel-qa
          path: /tmp/gth-native-pixel-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload native JS build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-android-js-export
          path: apps/gth-mobile/dist
          retention-days: 3

  android-standalone-qa-apk:
    name: Android QA APK and unsigned Play candidate
    needs: mobile
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && inputs.play_version_code != '')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/gth-mobile
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install isolated native application
        run: npm ci --no-audit --no-fund
      - name: Generate local Android project without touching website
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Compile self-contained QA APK with bundled Hermes JavaScript
        if: github.event_name == 'pull_request'
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify QA APK signature and bundled JavaScript
        if: github.event_name == 'pull_request'
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -Z1 "$apk" | grep -qx 'assets/index.android.bundle'
          test "$(unzip -Z1 "$apk" | grep -c '^classes[0-9]*\.dex$')" -gt 0
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner_bin"
          "$apksigner_bin" verify "$apk"
          ls -lh "$apk"
      - name: Upload self-contained QA APK (NOT Play Store-signed)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-standalone-qa-apk-not-play-store
          path: apps/gth-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned Play bundle and check its packaged manifest and native libraries
        env:
          PLAY_VERSION_CODE: ${{ inputs.play_version_code }}
        run: |
          version_code="${PLAY_VERSION_CODE:-$(node -p 'require("./app.json").expo.android.versionCode')}"
          python3 scripts/check-play-bundle.py prepare "$version_code"
          (cd android && chmod +x ./gradlew && ./gradlew :app:bundleRelease --no-daemon --stacktrace)
          bundletool="$RUNNER_TEMP/gth-bundletool.jar"
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$bundletool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum -c -
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          python3 scripts/check-play-bundle.py verify "$version_code" "$bundletool" "$bundle"
          mv "$bundle" "$RUNNER_TEMP/gth-pro-unsigned.aab"
      - name: Upload unsigned Play candidate
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-play-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/gth-pro-unsigned.aab
          if-no-files-found: error
          retention-days: 7

  android-emulator-smoke:
    name: Android emulator — native install and home screen
    needs: android-standalone-qa-apk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download isolated standalone QA APK
        uses: actions/download-artifact@v4
        with:
          name: gth-pro-native-standalone-qa-apk-not-play-store
          path: /tmp/gth-native-installable
      - name: Enable Linux KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash apps/gth-mobile/scripts/qa-android-emulator.sh /tmp/gth-native-installable/app-release.apk
      - name: Upload Android emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-android-emulator-qa
          path: /tmp/gth-native-android-emulator/
          if-no-files-found: ignore
          retention-days: 7
