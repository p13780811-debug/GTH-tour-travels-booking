name: GTH Independent Native Mobile — isolated CI
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/gth-mobile/**"
      - ".github/workflows/gth-independent-native-ci.yml"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gth-native-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: apps/gth-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify website application files are unchanged
        working-directory: .
        run: |
          git fetch --no-tags origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD -- src/ public/ vercel.json next.config.ts package.json package-lock.json || true)"
          if [ -n "$changed" ]; then
            echo "Website source or deployment configuration changed:"; echo "$changed"; exit 1
          fi
      - name: Install isolated Expo / React Native dependencies
        run: npm install --no-audit --no-fund
      - name: Verify native colors reflect central website CSS
        run: npm run theme:check
      - name: Strict TypeScript verification
        run: npm run typecheck
      - name: Native source and API boundary tests
        run: npm test
      - name: Export Android JavaScript bundle without publishing
        run: npm run export
      - name: Upload native JS build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gth-pro-native-android-js-export
          path: apps/gth-mobile/dist
          retention-days: 3
