name: GTH India-First Supplier Inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/tours/india_first_sync.py'
      - 'tests/test_india_first_sync.py'
      - 'src/lib/tours/supplier-products.ts'
      - 'supabase/functions/gth-tour-supplier-ingest/**'
      - 'src/lib/tours/persisted-inventory.ts'
      - 'src/components/tours/SupplierTourCatalog.tsx'
      - '.github/workflows/gth-india-tour-inventory.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tours/india_first_sync.py'
      - 'tests/test_india_first_sync.py'
      - 'src/lib/tours/supplier-products.ts'
      - 'supabase/functions/gth-tour-supplier-ingest/**'
      - 'src/lib/tours/persisted-inventory.ts'
      - 'src/components/tours/SupplierTourCatalog.tsx'
      - '.github/workflows/gth-india-tour-inventory.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 20 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: gth-original-tour-inventory
  cancel-in-progress: false
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source identity, pagination, photo and safe upsert
        run: python3 -m unittest discover -s tests -p 'test_india_first_sync.py'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck isolated signed Edge function
        run: deno check --node-modules-dir=auto supabase/functions/gth-tour-supplier-ingest/index.ts
      - name: India supplier source smoke (never writes in PR)
        run: python3 scripts/tours/india_first_sync.py --scope india
      - name: India + worldwide rotating sync on merged main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GTH_TOURS_EDGE_URL: https://dqprqjmhxjnrllczqyhz.supabase.co/functions/v1/gth-tour-supplier-ingest
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error --proto '=https' --max-time 15             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gth-tours-inventory:dqprqjmhxjnrllczqyhz")"
          GTH_TOURS_OIDC_TOKEN="$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$GTH_TOURS_OIDC_TOKEN"
          echo "::add-mask::$GTH_TOURS_OIDC_TOKEN"
          export GTH_TOURS_OIDC_TOKEN
          python3 scripts/tours/india_first_sync.py --scope india --write
          python3 scripts/tours/india_first_sync.py --scope world --write
