name: Prepare Bulk Listing Parser Lockfile (Feature Branch Only)
on:
  push:
    branches:
      - feature/real-estate-bulk-listing-upload-20261105
    paths:
      - package.json

permissions:
  contents: write

jobs:
  prepare-dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Synchronize lockfile (never runs project scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only package lock on isolated feature branch
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(real-estate): lock browser PDF and Excel parser dependencies'
          git push origin HEAD:feature/real-estate-bulk-listing-upload-20261105
