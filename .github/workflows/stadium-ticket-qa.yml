name: Worldwide ticket discovery QA
on:
  pull_request:
    paths:
      - "src/app/stadiums/**"
      - "src/app/tickets/**"
      - "src/components/travel/TravelSectionNav.tsx"
      - "src/lib/travel/worldwide-ticket-sources.ts"
      - "src/lib/travel/stadium*.ts"
      - "tests/stadium-ticket-destinations.test.mjs"
      - "tests/worldwide-ticket-sources.test.mjs"
      - ".github/workflows/stadium-ticket-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stadium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ticket sources, categories, fallbacks and URL safety
        run: node --test tests/stadium-ticket-destinations.test.mjs tests/worldwide-ticket-sources.test.mjs
      - name: Ensure no broken in-page official sources anchor
        run: |
          if grep -R 'href="#official-stadium-sources"' src/app/stadiums; then
            echo "Stale stadium source anchor detected"
            exit 1
          fi
