name: GTH Flights White Label Release Checks

on:
  push:
    branches:
      - feat/gth-flights-whitelabel-recovery-20261016
  pull_request:
    branches:
      - main
    paths:
      - src/app/flights/**
      - src/components/flights/**
      - src/lib/flights/**
      - tests/flight-marketplace.test.mjs
      - tests/flight-whitelabel-release.test.mjs
      - .github/workflows/gth-flights-whitelabel-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Flight and partner regression tests
        run: node --test tests/flight-marketplace.test.mjs tests/flight-whitelabel-release.test.mjs
      - name: Lint
        run: npm run lint
      - name: Production build (no deployment)
        run: npm run build
