name: GTH Travel Bulk Hotels
on:
  # Scheduled workflows execute from GitHub's default branch only.
  # In this Travel feature branch, schedule remains inactive until an approved final merge.
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 9 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      region:
        required: true
        type: choice
        options: [asia/india/western-zone, asia/india/northern-zone, asia/india/southern-zone, asia/nepal, asia/sri-lanka, asia/bangladesh, europe/monaco]
      mode:
        required: true
        type: choice
        options: [dry-run, import]
        default: dry-run
      max_records:
        required: true
        type: string
        default: "5000"
permissions:
  contents: read
concurrency:
  group: osm-hotel-bulk-${{ inputs.region || 'asia/india' }}
  cancel-in-progress: false
jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.mode == 'import' && 'hotel-ingestion' || 'hotel-ingestion-preview' }}
    env:
      REGION: ${{ inputs.region || 'asia/india/western-zone' }}
      MODE: ${{ inputs.mode || 'dry-run' }}
      MAX_RECORDS: ${{ inputs.max_records || '5000' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.GTH_SUPABASE_URL }}
      SUPABASE_INGESTION_KEY: ${{ secrets.GTH_SUPABASE_INGESTION_KEY }}
      GTH_INGESTION_ENABLED: ${{ inputs.mode == 'import' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate allowlist and hard cap
        shell: bash
        run: |
          set -euo pipefail
          case "$REGION" in europe/monaco|asia/nepal|asia/sri-lanka|asia/bangladesh|asia/india/western-zone|asia/india/northern-zone|asia/india/southern-zone) ;; *) exit 1;; esac
          [[ "$MAX_RECORDS" =~ ^[1-9][0-9]{0,5}$ ]] || exit 1
          (( MAX_RECORDS <= 100000 )) || exit 1
          [[ "$MODE" == dry-run || "$MODE" == import ]] || exit 1
          if [[ "$MODE" == import ]]; then
            test -n "$SUPABASE_INGESTION_KEY"
            test -n "$NEXT_PUBLIC_SUPABASE_URL"
          fi
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download licensed extract
        run: |
          set -euo pipefail
          curl -fL --retry 3 --proto '=https' --max-time 2400 -o region.osm.pbf "https://download.geofabrik.de/${REGION}-latest.osm.pbf"
          test -s region.osm.pbf
      - name: Export accommodation OSM points
        run: |
          set -euo pipefail
          osmium tags-filter region.osm.pbf n/tourism=hotel,motel,hostel,guest_house,apartment,resort -o accommodation.osm.pbf --overwrite
          osmium export --add-unique-id=type_id --geometry-types=point -f geojsonseq accommodation.osm.pbf -o hotels.geojsonseq --overwrite
      - name: Guarded batch import
        run: |
          set -euo pipefail
          if [[ "$MODE" == import ]]; then
            python3 scripts/import_osm_hotels.py hotels.geojsonseq --limit "$MAX_RECORDS"
          else
            python3 scripts/import_osm_hotels.py hotels.geojsonseq --limit "$MAX_RECORDS" --dry-run
          fi
      - name: Attribution
        if: always()
        run: echo "OpenStreetMap contributors © ODbL 1.0; does not imply available rooms or live rates" >> "$GITHUB_STEP_SUMMARY"
