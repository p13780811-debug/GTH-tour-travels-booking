name: GTH Cross-Pillar Editorial SEO QA
on:
  pull_request:
    paths:
      - "src/data/blogEcosystem.ts"
      - "src/data/blogCross*.ts"
      - "src/data/blogs.ts"
      - "src/app/blog/**"
      - "src/app/real-estate/guides/**"
      - "src/app/knowledge/tenders/**"
      - "src/components/seo/EcosystemGuideResources.tsx"
      - "src/components/seo/PillarGuideIndex.tsx"
      - "src/app/sitemap.ts"
      - "src/app/real-estate/page.tsx"
      - "src/app/tender/page.tsx"
      - "tests/cross-pillar-editorial-seo.test.mjs"
      - ".github/workflows/cross-pillar-seo-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source-safe links, 20 research articles and sitemap checks
        run: node --test tests/cross-pillar-editorial-seo.test.mjs
