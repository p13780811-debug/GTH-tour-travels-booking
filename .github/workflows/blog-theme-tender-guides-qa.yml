name: Blog Theme and Tender Guide Link QA
on:
  pull_request:
    paths:
      - "src/app/blog/**"
      - "src/app/tender/guides/**"
      - "src/app/knowledge/tenders/**"
      - "tests/blog-theme-tender-guides.test.mjs"
      - ".github/workflows/blog-theme-tender-guides-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Blog layout and tender SEO route regression checks
        run: node --test tests/blog-theme-tender-guides.test.mjs
