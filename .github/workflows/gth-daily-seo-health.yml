name: GTH PRO Daily SEO Health
on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"
permissions:
  contents: read
jobs:
  read-only-public-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check canonical metadata, indexability and sitemap
        run: node scripts/monitor-seo.mjs
