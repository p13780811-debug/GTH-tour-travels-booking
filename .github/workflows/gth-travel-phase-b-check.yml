name: GTH Travel Phase B Checks

on:
  push:
    branches: [gth-travel-phase-b]
  pull_request:
    branches: [gth-inventory-onboarding-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regression tests
        run: npm run test:security
      - name: Lint
        run: npm run lint
      - name: Production build (not a deployment)
        run: npm run build
