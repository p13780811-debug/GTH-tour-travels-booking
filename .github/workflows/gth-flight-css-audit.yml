name: Flights CSS Runtime Audit

on:
  push:
    branches:
      - fix/gth-flights-detection-style-cleanup-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium and Playwright (audit only)
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare live Flights with supplier script blocked / enabled
        run: node scripts/flight-css-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flights-css-browser-audit
          path: |
            flights-no-widget.png
            flights-widget.png
          if-no-files-found: ignore
