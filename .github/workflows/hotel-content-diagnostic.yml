name: Bounded hotel content production diagnostics
on:
  push:
    branches: [diag/hotel-discovery-production-20261127]
    paths: ['.github/workflows/hotel-content-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: gth-hotel-content-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'p13780811-debug/GTH-tour-travels-booking' && github.ref == 'refs/heads/diag/hotel-discovery-production-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classify shared Redis errors without any supplier request
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOTEL_KEY: ${{ secrets.NUITEE_PRODUCTION_API_KEY }}
          REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RUNTIME_BUNDLE: ${{ secrets.GTH_CLOUDFLARE_RUNTIME_ENV }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, urllib.parse, hmac, hashlib, re
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          def request(url,headers,body=None,limit=512001):
              try:
                  with opener.open(urllib.request.Request(url,headers=headers,data=body),timeout=8) as r:
                      return r.status,r.read(limit)
              except urllib.error.HTTPError as e: return e.code,e.read(min(limit,4096))
              except Exception: return 0,b""
          def out(label,value): print(label,json.dumps(value,separators=(",",":")),flush=True)
          cf_token,account=os.getenv("CF_TOKEN",""),os.getenv("CF_ACCOUNT","")
          key,redis,token=os.getenv("HOTEL_KEY",""),os.getenv("REDIS_URL",""),os.getenv("REDIS_TOKEN","")
          out("REQUIRED_SECRET_PRESENCE",{"hotel":bool(key),"redis_url":bool(redis),"redis_token":bool(token),"cloudflare":bool(cf_token and account)})
          if cf_token and re.fullmatch(r"[a-fA-F0-9]{32}",account):
              s,b=request("https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/gth-pro-production/settings",{"Authorization":"Bearer "+cf_token})
              names=set()
              if s==200:
                  try: names={v.get("name") for v in json.loads(b).get("result",{}).get("bindings",[])}
                  except Exception: pass
              out("PRODUCTION_BINDINGS",{"status":s,"hotel":"NUITEE_PRODUCTION_API_KEY" in names,"redis_url":"UPSTASH_REDIS_REST_URL" in names,"redis_token":"UPSTASH_REDIS_REST_TOKEN" in names,"ingress":"GTH_CLOUDFLARE_INGRESS" in names})
          try:
              u=urllib.parse.urlsplit(redis)
              assert u.scheme=="https" and u.hostname.endswith(".upstash.io") and not u.username and not u.password and not u.port and not u.query and not u.fragment and u.path in ("","/") and token
          except Exception:
              out("GUARD",{"status":"invalid_or_missing_config","provider_called":False});raise SystemExit(1)
          headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"}
          # Same identity and key format as the existing rate-limit.ts guard.
          # Never call the supplier when Redis is unavailable or its guard denies.
          namespace="gth-pro"
          for line in os.getenv("RUNTIME_BUNDLE","").splitlines():
              if line.startswith("GTH_RATE_LIMIT_NAMESPACE="):
                  namespace=line.split("=",1)[1].strip().strip("'").strip('"')
          if not re.fullmatch(r"[a-zA-Z0-9_-]{1,64}",namespace):
              out("GUARD",{"status":"invalid_namespace","provider_called":False});raise SystemExit(1)
          digest=hmac.new(token.encode(),b"user:shared-free-hotel-content",hashlib.sha256).hexdigest()
          prefix="{"+namespace+":production:rl:v1:hotel_content}"
          keys=[prefix+":"+digest+":minute",prefix+":"+digest+":day",prefix+":global:minute",prefix+":global:day"]
          def classification(body):
              try: msg=str(json.loads(body).get("error","")).lower()
              except Exception: msg=""
              if any(x in msg for x in ("max daily","max monthly","request limit","quota","max requests","limit exceeded","usage limit","max command")): return "quota_exhausted"
              if any(x in msg for x in ("max data","storage","memory","oom")): return "storage_limit"
              if any(x in msg for x in ("unauthorized","invalid token","authentication","wrongpass","noauth")): return "authentication"
              if any(x in msg for x in ("unsupported","not allowed","not supported","disabled","noperm","unknown command")): return "command_restricted"
              if any(x in msg for x in ("syntax","wrong number","script","lua","compile","eval")): return "script_or_protocol"
              if any(x in msg for x in ("suspended","disabled","blocked","payment","billing")): return "account_restriction"
              if any(x in msg for x in ("not found","database","deleted")): return "database_unavailable"
              return "unclassified"
          for command in [["PING"],["MGET",*keys]]:
              s,b=request(redis,headers,json.dumps(command).encode(),4096)
              try: result=json.loads(b).get("result")
              except Exception: result=None
              info={"command":command[0],"http":s,"error_category":classification(b) if s!=200 else None}
              if command[0]=="MGET" and isinstance(result,list) and len(result)==4:
                  info["counts"]=[int(x) if isinstance(x,(str,int)) and str(x).isdigit() else None for x in result]
              out("REDIS_READ_DIAGNOSTIC",info)
          PY
