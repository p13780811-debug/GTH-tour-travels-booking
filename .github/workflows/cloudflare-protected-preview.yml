name: Cloudflare protected preview activation
on:
  push:
    branches: [infra/cloudflare-preflight-20261125]
    paths: ['.github/workflows/cloudflare-protected-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gth-cloudflare-protected-preview
  cancel-in-progress: false
jobs:
  protect:
    if: github.repository == 'p13780811-debug/GTH-tour-travels-booking' && github.ref == 'refs/heads/infra/cloudflare-preflight-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Protect and enable only the existing staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, re, sys, urllib.request, urllib.error, urllib.parse, time
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          worker = "gth-pro-preview-20261126"
          if not token or not re.fullmatch(r"[0-9a-fA-F]{32}", account):
              sys.exit("Missing Cloudflare connection configuration.")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def api(method, path, body=None, label="API", allow_missing_subdomain=False):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json"},
                  method=method)
              try:
                  with opener.open(req, timeout=25) as response:
                      data=json.load(response)
              except urllib.error.HTTPError as e:
                  try:
                      errors=json.load(e).get("errors",[])
                  except Exception:
                      errors=[]
                  codes=[str(x.get("code")) for x in errors if isinstance(x.get("code"),int)]
                  print(label + ": HTTP " + str(e.code) + "; Cloudflare error codes=" + ",".join(codes))
                  if allow_missing_subdomain and e.code==404 and "10007" in codes:
                      return None
                  sys.exit(label + " failed: HTTP " + str(e.code) + ". No further activation attempted.")
              except Exception:
                  sys.exit(label + " failed; no further activation attempted.")
              if not data.get("success"):
                  sys.exit(label + " rejected by Cloudflare.")
              return data
          base="/accounts/"+account
          route=base+"/workers/scripts/"+worker+"/subdomain"
          sub=api("GET",base+"/workers/subdomain",label="Account workers.dev subdomain",allow_missing_subdomain=True)
          suffix=sub["result"].get("subdomain","") if sub is not None else "gthproglobal-preview-20261126"
          if not re.fullmatch(r"[a-z0-9-]+",suffix):
              sys.exit("Invalid workers.dev subdomain; no URL enabled.")
          host=worker+"."+suffix+".workers.dev"
          status=api("GET",route,label="Worker URL status")["result"]
          if status.get("enabled") or status.get("previews_enabled"):
              sys.exit("Worker already has enabled URLs; inspect existing protection before modification.")
          metadata=api("GET",base+"/workers/workers/"+worker,label="Worker identity")["result"]
          wid=metadata.get("id","")
          if metadata.get("name") != worker or not re.fullmatch(r"[a-f0-9]{32}",wid):
              sys.exit("Unexpected worker identity; no changes made.")
          # Cloudflare GET /user documents email and id, not email_verified.
          # Bind the exact authenticated account email; Access must independently
          # authenticate possession of that address before allowing requests.
          identity=api("GET","/user",label="Cloudflare token owner identity")["result"]
          email=identity.get("email","")
          if identity.get("suspended") is True or not re.fullmatch(r"[a-f0-9]{32}",identity.get("id","")) or not re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+",email):
              sys.exit("Cannot identify active token owner; no URL enabled.")
          print("Authenticated Cloudflare user identity resolved; email not logged.")
          apps=[]
          for page in range(1,101):
              data=api("GET",base+"/access/apps?per_page=100&page="+str(page),label="Access application inventory")
              rows=data.get("result",[])
              if not isinstance(rows,list): sys.exit("Unexpected Access inventory.")
              apps.extend(rows)
              if len(rows)<100: break
          else: sys.exit("Access inventory incomplete.")
          def targets(app):
              return app.get("domain")==host or any(d.get("worker_id")==wid or d.get("uri")==host for d in app.get("destinations",[]))
          if any(targets(a) for a in apps):
              sys.exit("Existing Access rule for this Worker or hostname; no policy overwritten.")
          # Refuse any existing wildcard hostname policy that could override
          # the worker-level rule; only this isolated Worker is in scope.
          import fnmatch
          for app in apps:
              names=[app.get("domain","")]+[d.get("uri","") for d in app.get("destinations",[])]
              if any(isinstance(n,str) and n and fnmatch.fnmatch(host,n.split("/")[0]) for n in names):
                  sys.exit("Existing hostname Access rule may overlap; no change made.")
          app=api("POST",base+"/access/apps",{
              "type":"self_hosted","name":"GTH PRO private preview 20261126",
              "destinations":[{"type":"worker","worker_id":wid}],
              "policies":[{"name":"Authenticated Cloudflare token owner only","decision":"allow","include":[{"email":{"email":email}}]}],
              "session_duration":"8h"
          },label="Create restricted Worker Access application")["result"]
          aid=app.get("id","")
          if not re.fullmatch(r"[a-f0-9-]{32,36}",aid):
              sys.exit("Cannot confirm Access application ID; URL remains disabled.")
          check=api("GET",base+"/access/apps/"+aid,label="Verify restricted Access application")["result"]
          if not any(d.get("type")=="worker" and d.get("worker_id")==wid for d in check.get("destinations",[])):
              sys.exit("Worker Access protection not verified; URL remains disabled.")
          policies=api("GET",base+"/access/apps/"+aid+"/policies",label="Verify Access policy")["result"]
          if not isinstance(policies,list) or len(policies)!=1 or policies[0].get("decision")!="allow" or policies[0].get("include")!=[{"email":{"email":email}}]:
              sys.exit("Exact owner-only policy not verified; URL remains disabled.")
          print("Verified owner-only Cloudflare Access policy on staging Worker.")
          if sub is None:
              # Recheck immediately before registering. Never rename an existing
              # account subdomain or change production DNS.
              current=api("GET",base+"/workers/subdomain",label="Recheck missing subdomain",allow_missing_subdomain=True)
              if current is not None:
                  sys.exit("Account subdomain appeared concurrently; no registration performed.")
              created=api("PUT",base+"/workers/subdomain",{"subdomain":suffix},label="Register previously absent workers.dev subdomain")["result"]
              if created.get("subdomain")!=suffix:
                  sys.exit("Subdomain registration not verified; URL remains disabled.")
              print("New workers.dev account subdomain registered.")
          enabled=False
          try:
              api("POST",route,{"enabled":True,"previews_enabled":False},label="Enable protected workers.dev URL")
              enabled=True
              confirmed=api("GET",route,label="Verify URL settings")["result"]
              if confirmed.get("enabled") is not True or confirmed.get("previews_enabled") is not False:
                  raise RuntimeError("Unexpected URL settings")
              # Confirm anonymous traffic receives Access login, not application HTML.
              for attempt in range(5):
                  try:
                      req=urllib.request.Request("https://"+host+"/",headers={"User-Agent":"GTH-Preview-Verification/1.0"})
                      with opener.open(req,timeout=15) as resp:
                          code=resp.status; loc=resp.headers.get("Location","")
                  except urllib.error.HTTPError as e:
                      code=e.code; loc=e.headers.get("Location","")
                  except Exception:
                      code=0; loc=""
                  parsed=urllib.parse.urlparse(loc)
                  if code in (301,302,303,307,308) and parsed.scheme=="https" and parsed.hostname and parsed.hostname.endswith(".cloudflareaccess.com") and parsed.path.startswith("/cdn-cgi/access/login"):
                      print("PROTECTED_PREVIEW_URL=https://"+host)
                      with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
                          summary.write("Protected preview: https://"+host+"\n\nAnonymous request redirected to Cloudflare Access login. Authenticated application smoke tests remain outstanding.\n")
                      break
                  time.sleep(3)
              else: raise RuntimeError("Anonymous Access challenge not confirmed")
          except BaseException:
              if enabled:
                  api("POST",route,{"enabled":False,"previews_enabled":False},label="Rollback URL activation")
              sys.exit("Protected URL verification failed; no public preview claimed.")
          PY
