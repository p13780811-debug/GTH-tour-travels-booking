name: Cloudflare OpenNext compatibility build
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-build-probe.yml'
      - 'next.config.ts'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-app-install.test.mjs'
  push:
    branches: [infra/cloudflare-preflight-20261125]
    paths:
      - '.github/workflows/cloudflare-build-probe.yml'
      - 'next.config.ts'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-app-install.test.mjs'
permissions:
  contents: read
concurrency:
  group: cloudflare-build-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned adapter outside locked app dependency tree
        shell: bash
        run: |
          set -euo pipefail
          TOOL_DIR="$RUNNER_TEMP/gth-cloudflare-tools"
          mkdir -p "$TOOL_DIR"
          npm install --prefix "$TOOL_DIR" --no-audit --no-fund --save-exact @opennextjs/cloudflare@1.20.17 wrangler@4.168.0
          mkdir -p node_modules/@opennextjs
          test ! -e node_modules/@opennextjs/cloudflare
          test ! -e node_modules/wrangler
          ln -s "$TOOL_DIR/node_modules/@opennextjs/cloudflare" node_modules/@opennextjs/cloudflare
          ln -s "$TOOL_DIR/node_modules/wrangler" node_modules/wrangler
          ln -s "$TOOL_DIR/node_modules/.bin/opennextjs-cloudflare" node_modules/.bin/opennextjs-cloudflare
          ln -s "$TOOL_DIR/node_modules/.bin/wrangler" node_modules/.bin/wrangler
          echo "$TOOL_DIR/node_modules/.bin" >> "$GITHUB_PATH"
          git diff --exit-code -- package.json package-lock.json
      - name: Generate isolated Worker configuration (no domain or paid resource)
        run: |
          test ! -e wrangler.jsonc && test ! -e wrangler.toml && test ! -e wrangler.json
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "gth-pro-migration",
            "main": ".open-next/worker.js",
            "minify": true,
            "compatibility_date": "2026-11-18",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "assets": {"directory": ".open-next/assets", "binding": "ASSETS"},
            "services": [{"binding": "WORKER_SELF_REFERENCE", "service": "gth-pro-migration"}]
          }
          EOF
          test ! -e open-next.config.ts
          printf '%s\n' 'import { defineCloudflareConfig } from "@opennextjs/cloudflare";' 'export default defineCloudflareConfig();' > open-next.config.ts
      - name: Verify PWA legacy route and approved icon assets
        run: node --test tests/mobile-app-install.test.mjs
      - name: OpenNext build (compile-only fixtures; never deployed)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
          GTH_PUBLIC_LAUNCH_ENABLED: "false"
        run: ./node_modules/.bin/opennextjs-cloudflare build
      - name: Verify Worker bundle without uploading
        run: |
          test -f .open-next/worker.js
          ./node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/gth-worker-dry-run --metafile /tmp/gth-worker-meta.json
      - name: Rank actual OpenNext and Wrangler bundle inputs (no secrets, no upload)
        run: |
          python3 - <<'PY'
          import json, pathlib, gzip, collections
          root = pathlib.Path(".open-next/server-functions")
          def rank_meta(path, label):
              m = json.loads(path.read_text())
              sizes = collections.Counter()
              for output in m.get("outputs", {}).values():
                  for name, data in output.get("inputs", {}).items():
                      sizes[name] += data.get("bytesInOutput", 0)
              if not sizes:
                  raise RuntimeError("No input byte contributions in " + str(path))
              print(label)
              for i, (name, size) in enumerate(sizes.most_common(10), 1):
                  print(f"BUNDLE_TOP {i:02d} {size:12d} {name}")
              packages = collections.Counter()
              for name, size in sizes.items():
                  if "node_modules/" in name:
                      tail = name.rsplit("node_modules/", 1)[-1].split("/")
                      pkg = "/".join(tail[:2]) if tail[0].startswith("@") else tail[0]
                      packages[pkg] += size
              print(label + " — dependency groups")
              for i, (name, size) in enumerate(packages.most_common(10), 1):
                  print(f"BUNDLE_PACKAGE {i:02d} {size:12d} {name}")
          metas = sorted(root.rglob("handler.mjs.meta.json"))
          if not metas:
              print("OpenNext handler metafile not emitted; reporting final Wrangler input contributions instead.")
          for meta in metas:
              rank_meta(meta, "OpenNext input raw bytes: " + str(meta))
          rank_meta(pathlib.Path("/tmp/gth-worker-meta.json"), "Final Wrangler input raw bytes")
          for directory, label in [(root, "OpenNext server files (inventory, not all uploaded)"), (pathlib.Path("/tmp/gth-worker-dry-run"), "Wrangler emitted files")]:
              files = []
              for p in directory.rglob("*"):
                  if p.is_file() and not p.is_symlink() and not p.name.endswith(".meta.json") and not p.name.endswith(".map"):
                      raw = p.stat().st_size
                      files.append((raw, p))
              print(label + " — raw bytes and standalone gzip bytes (not additive)")
              for i, (raw, p) in enumerate(sorted(files, key=lambda x: (-x[0], str(x[1])))[:10], 1):
                  compressed = len(gzip.compress(p.read_bytes(), compresslevel=9, mtime=0))
                  print(f"BUNDLE_FILE {i:02d} {raw:12d} {compressed:12d} {p}")
          PY
