name: GTH App 2.0 — Chromium mobile journey QA
on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/app/**"
      - "src/components/mobile/**"
      - "src/lib/mobile/**"
      - "scripts/qa-app-unified-journey.mjs"
      - ".github/workflows/gth-app-unified-journey-qa.yml"
  push:
    branches: [main]
    paths:
      - "src/app/app/**"
      - "src/components/mobile/**"
      - "src/lib/mobile/**"
      - "scripts/qa-app-unified-journey.mjs"
      - ".github/workflows/gth-app-unified-journey-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gth-app-unified-journey-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install isolated Chromium runner
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Start unchanged Next.js app in development mode
        run: |
          npm run dev > /tmp/gth-app-dev.log 2>&1 &
          echo $! > /tmp/gth-app-dev.pid
          ok=0
          for i in $(seq 1 70); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/manifest.webmanifest > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then tail -100 /tmp/gth-app-dev.log; exit 1; fi
      - name: Android size and actual discovery to Research Desk interactions
        run: node scripts/qa-app-unified-journey.mjs
      - name: Capture QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gth-app-2-mobile-journey
          path: /tmp/gth-app-journey-qa/
          if-no-files-found: ignore
          retention-days: 3
      - name: Log any application failure without hiding the test result
        if: failure()
        run: tail -100 /tmp/gth-app-dev.log || true
