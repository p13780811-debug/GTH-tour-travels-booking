name: Ticket editorial SEO QA
on:
  pull_request:
    paths:
      - "src/data/blogTickets.ts"
      - "src/data/blogs.ts"
      - "src/app/blog/**"
      - "src/app/tickets/**"
      - "src/components/travel/TicketBlogLinks.tsx"
      - "src/app/sitemap.ts"
      - "tests/ticket-blog-seo.test.mjs"
      - ".github/workflows/ticket-editorial-seo-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ticket-editorial-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check published ticket guides, links and sitemap
        run: node --test tests/ticket-blog-seo.test.mjs
