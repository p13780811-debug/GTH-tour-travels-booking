name: GTH Flights Visual Recovery

on:
  push:
    branches:
      - fix/gth-global-navbar-flight-status-20261017
  pull_request:
    branches:
      - main
    paths:
      - src/app/layout.tsx
      - src/app/flights/**
      - src/components/flights/**
      - src/components/Navbar.tsx
      - src/components/SearchBox.tsx
      - tests/shared-navbar-flight-status.test.mjs
      - tests/flight-visual-recovery.test.mjs
      - tests/flight-search-results-routing.test.mjs
      - src/middleware.ts
      - .github/workflows/gth-flights-visual-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Flight visual and functional regressions
        run: node --test tests/shared-navbar-flight-status.test.mjs tests/flight-visual-recovery.test.mjs tests/flight-marketplace.test.mjs tests/flight-whitelabel-release.test.mjs tests/flight-whitelabel-isolation.test.mjs tests/flight-supplier-css-layer.test.mjs tests/travel-phase-b.test.mjs tests/flight-search-results-routing.test.mjs
      - name: Lint
        run: npm run lint
      - name: Production build (no deploy)
        run: npm run build
