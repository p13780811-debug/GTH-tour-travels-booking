name: Hotel Booking and Stadium Venue Relevance QA
on:
  pull_request:
    paths:
      - "src/app/hotels/**"
      - "src/app/app/hotels/**"
      - "src/app/search/**"
      - "src/lib/mobile/universal-search.ts"
      - "src/lib/travel/stadium-partner-discovery.ts"
      - "src/app/stadiums/**"
      - "src/components/travel/**"
      - "src/components/destination/DestinationExplorerResults.tsx"
      - "src/data/blogExpansion.ts"
      - "tests/hotel-booking-intent-regression.test.mjs"
      - "tests/mobile-universal-search-routing.test.mjs"
      - "tests/stadium-partner-discovery.test.mjs"
      - ".github/workflows/hotel-booking-stadium-relevance-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  booking-relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check booking vs directory routes, hotel search and exact stadium product links
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          node --test tests/hotel-booking-intent-regression.test.mjs tests/mobile-universal-search-routing.test.mjs tests/stadium-partner-discovery.test.mjs
