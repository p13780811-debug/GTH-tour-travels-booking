name: GTH PRO Android — owner-approved public APK (no Play fees)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Unique immutable release tag (android-v0.1.0-rc.1)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: gth-android-public-release
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Test, stable-sign and publish Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Configure environment protection/reviewers in GitHub before enabling this flow.
    environment: android-apk-publication
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/gth-mobile
    env:
      CI: "1"
      GTH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gth-upload-keystore.jks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require explicit owner release gate and validated tag
        working-directory: .
        env:
          RELEASE_ENABLED: ${{ vars.GTH_SIGNED_ANDROID_RELEASE_ENABLED }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RELEASE_ENABLED" = "true" || { echo "Signed APK publishing is disabled by default"; exit 1; }
          app_version="$(node -p 'require("./apps/gth-mobile/app.json").expo.version')"
          if [[ ! "$RELEASE_TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release tag is not an approved Android app version"; exit 1
          fi
          if [[ "$RELEASE_TAG" != "android-v$app_version" && "$RELEASE_TAG" != "android-v$app_version"-rc.* ]]; then
            echo "Release version must match native app.json"; exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag is already published and must not be overwritten"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install and test the existing native project
        run: |
          npm ci --no-audit --no-fund
          npm run theme:check
          npm run typecheck
          npm test
      - name: Generate clean Android project (does not touch website)
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Decode owner's persistent encrypted signing material
        env:
          GTH_ANDROID_KEYSTORE_B64: ${{ secrets.GTH_ANDROID_KEYSTORE_B64 }}
          GTH_ANDROID_STORE_PASSWORD: ${{ secrets.GTH_ANDROID_STORE_PASSWORD }}
          GTH_ANDROID_KEY_ALIAS: ${{ secrets.GTH_ANDROID_KEY_ALIAS }}
          GTH_ANDROID_KEY_PASSWORD: ${{ secrets.GTH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GTH_ANDROID_KEYSTORE_B64" && test -n "$GTH_ANDROID_STORE_PASSWORD" &&
            test -n "$GTH_ANDROID_KEY_ALIAS" && test -n "$GTH_ANDROID_KEY_PASSWORD" ||
            { echo "Missing protected owner signing inputs"; exit 1; }
          umask 077
          printf '%s' "$GTH_ANDROID_KEYSTORE_B64" | base64 --decode > "$GTH_ANDROID_KEYSTORE_PATH"
          test -s "$GTH_ANDROID_KEYSTORE_PATH"
      - name: Configure stable release signing and build standalone APK
        env:
          GTH_ANDROID_STORE_PASSWORD: ${{ secrets.GTH_ANDROID_STORE_PASSWORD }}
          GTH_ANDROID_KEY_ALIAS: ${{ secrets.GTH_ANDROID_KEY_ALIAS }}
          GTH_ANDROID_KEY_PASSWORD: ${{ secrets.GTH_ANDROID_KEY_PASSWORD }}
        run: |
          node ../../scripts/android/configure-release-signing.mjs android/app/build.gradle
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature, certificate, package and integrity
        env:
          EXPECTED_CERT_SHA256: ${{ vars.GTH_ANDROID_SIGNER_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$apksigner_bin" && test -n "$aapt_bin"
          "$apksigner_bin" verify --verbose "$apk"
          signer="$("$apksigner_bin" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$signer" =~ ^[a-f0-9]{64}$ ]] && [[ "$expected" =~ ^[a-f0-9]{64}$ ]] &&
            test "$signer" = "$expected" || { echo "Signing certificate did not match the owner's pinned certificate"; exit 1; }
          "$aapt_bin" dump badging "$apk" | grep -q "package: name='com.gthpro.mobile'"
          unzip -Z1 "$apk" | grep -qx 'assets/index.android.bundle'
          test "$(unzip -Z1 "$apk" | grep -c '^classes[0-9]*\.dex$')" -gt 0
          mkdir -p "$RUNNER_TEMP/gth-release"
          cp "$apk" "$RUNNER_TEMP/gth-release/GTH-PRO-Android.apk"
          (cd "$RUNNER_TEMP/gth-release" && sha256sum GTH-PRO-Android.apk > SHA256SUMS.txt)
      - name: Publish public GitHub Release only after complete verified signing
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/gth-release/GTH-PRO-Android.apk" \
            "$RUNNER_TEMP/gth-release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GTH PRO Android — $RELEASE_TAG (direct distribution)" \
            --notes "Owner-controlled release-signing certificate verified against pinned SHA-256. This is a direct Android APK distribution, not a Google Play approval. Verify SHA256SUMS.txt before installation; keep Play Protect enabled. GTH PRO research notes are local-only. Existing QA APKs may have different signing certificates. No supplier APIs, RLS or website code changed." \
            --prerelease
      - name: Destroy temporary keystore
        if: always()
        run: |
          if [ -f "$GTH_ANDROID_KEYSTORE_PATH" ]; then
            shred -u "$GTH_ANDROID_KEYSTORE_PATH" 2>/dev/null || rm -f "$GTH_ANDROID_KEYSTORE_PATH"
          fi
