name: MahaRERA public endpoint probe

on:
  push:
    branches: [gth-mumbai-thane-rera-ingestion]
    paths:
      - scripts/probe_rera_endpoint.py
      - .github/workflows/gth-rera-endpoint-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - name: Check public source without authentication or database writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/probe_rera_endpoint.py
