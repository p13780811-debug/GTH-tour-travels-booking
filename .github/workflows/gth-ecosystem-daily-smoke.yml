name: GTH PRO Daily Route Availability
on:
  push:
    branches:
      - fix/gth-production-journey-monitor-20261017
  pull_request:
    branches:
      - main
    paths:
      - scripts/monitor-ecosystem.mjs
      - .github/workflows/gth-ecosystem-daily-smoke.yml
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: read
jobs:
  read-only-route-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check production public routes without modification
        env:
          GTH_PRO_MONITOR_URL: https://www.gthproglobal.com
        run: node scripts/monitor-ecosystem.mjs
