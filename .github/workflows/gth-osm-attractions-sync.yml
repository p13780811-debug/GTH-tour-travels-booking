name: GTH Worldwide Open Attractions — Licensed ODbL Sync
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gth-osm-attractions-sync.yml"
      - "scripts/attractions/import_osm_attractions.py"
      - "scripts/attractions/geofabrik_registry.py"
      - "supabase/functions/gth-osm-attractions-ingest/**"
  workflow_dispatch:
    inputs:
      region:
        description: "Optional official Geofabrik region (validated against live index)"
        required: false
        type: string
      mode:
        description: "Preview with no write, or signed import"
        required: true
        type: choice
        options: [dry-run, import]
        default: dry-run
permissions:
  contents: read
  id-token: write
concurrency:
  group: gth-osm-open-attractions
  cancel-in-progress: false
jobs:
  import-real-source-places:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GTH_OSM_ATTRACTIONS_EDGE_URL: https://dqprqjmhxjnrllczqyhz.supabase.co/functions/v1/gth-osm-attractions-ingest
      GTH_OSM_ATTRACTIONS_IMPORT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline source, contract and worldwide registry validation
        run: |
          python3 -m unittest discover -s tests -p "test_osm_attractions.py"
          python3 -m unittest discover -s tests -p "test_geofabrik_registry.py"
          node --test tests/osm-attractions-contract.test.mjs
      - name: Resolve an approved single-country Geofabrik extract
        shell: bash
        env:
          REQUESTED_REGION: ${{ inputs.region }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            MODE="$REQUESTED_MODE"
          else
            MODE=import
          fi
          [[ "$MODE" == import || "$MODE" == dry-run ]] || exit 1
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          if [[ -n "$REQUESTED_REGION" ]]; then
            python3 scripts/attractions/geofabrik_registry.py --region "$REQUESTED_REGION" --env-file "$GITHUB_ENV"
          else
            python3 scripts/attractions/geofabrik_registry.py --slot "$GITHUB_RUN_NUMBER" --env-file "$GITHUB_ENV"
          fi
      - name: Install open source osmium utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download exact official ODbL PBF (bounded to GitHub runner resources)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --proto '=https' --max-time 2400 --max-filesize 1400000000 \
            "$PBF_URL" -o region.osm.pbf
          test -s region.osm.pbf
      - name: Extract real mapped names and geometry
        shell: bash
        run: |
          set -euo pipefail
          osmium tags-filter region.osm.pbf \
            nwr/tourism=attraction,museum,viewpoint,zoo,theme_park \
            nwr/historic=fort,castle,ruins,monument,archaeological_site \
            nwr/natural=beach \
            nwr/boundary=national_park \
            nwr/leisure=park,nature_reserve \
            -o mapped-places.osm.pbf --overwrite
          osmium export --add-unique-id=type_id --geometry-types=point,polygon \
            -f geojsonseq mapped-places.osm.pbf -o mapped-places.geojsonseq --overwrite
      - name: Import with exact signed workflow identity and record completed sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == dry-run ]]; then
            python3 scripts/attractions/import_osm_attractions.py mapped-places.geojsonseq \
              --region "$REGION" --country-code "$COUNTRY_CODE" --country-name "$COUNTRY_NAME" \
              --limit 120000 --dry-run
            exit 0
          fi
          token_json="$(curl --fail --silent --show-error --proto '=https' \
            --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gth-osm-attractions:dqprqjmhxjnrllczqyhz")"
          GTH_OSM_ATTRACTIONS_OIDC_TOKEN="$(printf '%s' "$token_json" | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$GTH_OSM_ATTRACTIONS_OIDC_TOKEN"
          echo "::add-mask::$GTH_OSM_ATTRACTIONS_OIDC_TOKEN"
          export GTH_OSM_ATTRACTIONS_OIDC_TOKEN
          python3 scripts/attractions/import_osm_attractions.py mapped-places.geojsonseq \
            --region "$REGION" --country-code "$COUNTRY_CODE" --country-name "$COUNTRY_NAME" \
            --limit 120000 --run-id "$GITHUB_RUN_ID"
          echo "© OpenStreetMap contributors · ODbL 1.0 via Geofabrik: region=$REGION country=$COUNTRY_CODE. Community mapping, not venue certification or ticket stock." >> "$GITHUB_STEP_SUMMARY"
