name: GTH Open Attractions — Python Source Gate
on:
  pull_request:
    paths:
      - "scripts/attractions/import_osm_attractions.py"
      - "scripts/attractions/geofabrik_registry.py"
      - "tests/test_geofabrik_registry.py"
      - "src/lib/travel/osmAttractions.ts"
      - "src/app/attractions/**"
      - "src/app/api/travel/osm-attractions/**"
      - "supabase/migrations/*osm_worldwide_directory.sql"
      - "supabase/migrations/*osm_sync_resume_and_idempotence.sql"
      - "supabase/functions/gth-osm-attractions-ingest/**"
      - "tests/test_osm_attractions.py"
      - "tests/osm-attractions-contract.test.mjs"
      - ".github/workflows/gth-osm-attractions-sync.yml"
      - ".github/workflows/gth-open-attractions-source-checks.yml"
  push:
    branches: [main]
    paths:
      - "scripts/attractions/import_osm_attractions.py"
      - "scripts/attractions/geofabrik_registry.py"
      - "tests/test_geofabrik_registry.py"
      - "src/lib/travel/osmAttractions.ts"
      - "src/app/attractions/**"
      - "src/app/api/travel/osm-attractions/**"
      - "supabase/migrations/*osm_worldwide_directory.sql"
      - "supabase/migrations/*osm_sync_resume_and_idempotence.sql"
      - "supabase/functions/gth-osm-attractions-ingest/**"
      - "tests/test_osm_attractions.py"
      - ".github/workflows/gth-open-attractions-source-checks.yml"
permissions:
  contents: read
jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test OSM parser provenance without fetching data or secrets
        run: python3 -m unittest discover -s tests -p "test_osm_attractions.py"
      - name: Validate worldwide Geofabrik index selection and ISO inference
        run: python3 -m unittest discover -s tests -p "test_geofabrik_registry.py"
      - name: Test RLS, route, source-licensed semantics
        run: node --test tests/osm-attractions-contract.test.mjs
      - name: Set up Deno for protected OSM gateway typecheck
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck OIDC-only OSM source gateway
        run: deno check --config supabase/functions/gth-osm-attractions-ingest/deno.json supabase/functions/gth-osm-attractions-ingest/index.ts
