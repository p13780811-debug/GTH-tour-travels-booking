name: Hotel content cache and usage protection QA
on:
  pull_request:
    branches: [infra/cloudflare-preflight-20261125]
    paths:
      - 'src/lib/travel/nuitee-*.ts'
      - 'src/app/api/hotels/discovery/route.ts'
      - 'src/components/hotel/NearbyHotelDiscovery.tsx'
      - 'scripts/cloudflare-hotel-content.mjs'
      - 'tests/cloudflare-hotel-content.test.mjs'
      - '.github/workflows/hotel-content-cache-qa.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: node --test tests/cloudflare-hotel-content.test.mjs tests/hotel-geographic-discovery.test.mjs tests/nuitee-free-usage-boundary.test.mjs tests/nuitee-free-currencies.test.mjs
      - run: npx --no-install tsc --noEmit
